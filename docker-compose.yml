version: '3.8'

services:
  backend:
    build: .
    container_name: backend-container
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DB=projectdevops
      - MYSQL_PORT=3307
    depends_on:
      - mysql
    networks:
      - backend-network

  mysql:
    image: mysql:5.7
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: projectdevops
    ports:
      - "3307:3306"
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
